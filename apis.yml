aid: workwell-technologies
name: Workwell Technologies
description: 'Workwell Technologies, Inc. is a Carlsbad, California workforce management
  company backed by Battery Ventures, best known for its uAttend cloud-connected time
  and attendance platform and uPunch punch clocks. uAttend pairs biometric time clocks
  (fingerprint, facial recognition, RFID, voice control) with cloud software for time
  tracking, scheduling, overtime alerts, and optional payroll processing for small
  businesses. The WorkWell Technologies API exposes employee, timecard, and punch
  data from uAttend accounts over HTTPS with API-key authentication, supporting payroll
  and HRIS integrations.'
