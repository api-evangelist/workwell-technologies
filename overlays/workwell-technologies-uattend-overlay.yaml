- target: $.paths['/reports/punch'].post
  update:
    x-apievangelist-pagination: >-
      Page-based pagination via UsePaging/PageSize/PageNumber (0-indexed);
      EndDate must be within 3 months of StartDate.
- target: $.components.securitySchemes.ApiKeyAuth
